# motor_gains.yaml
# ============================================================================
# Dynamixel PID 게인 프로파일
#
# ★ 게인은 RAM 영역이다 ★
#   전원 OFF 또는 모터 REBOOT 시 EEPROM 기본값(P=800, I=0, D=0)으로
#   돌아간다. body_motor_controller 가 기동 시와 리부트 직후에 이 파일을
#   자동으로 다시 쓴다.
#
# ── 적용 우선순위 ──
#   default  →  groups  →  joints        (뒤에 오는 것이 이긴다)
#
# ── 튜닝 중 재적용 ──
#   이 파일을 고친 뒤 노드 재시작 없이 반영할 수 있다.
#     ros2 service call /body_motor_controller/reload_gains \
#         std_srvs/srv/Trigger
#   토크를 끄지 않으므로 로봇이 서 있는 채로, 걷는 중에도 바꿀 수 있다.
#
# ── 내부 스케일 (e-manual) ──
#   PWM 기여분 = P/128 * err + I/65536 * ∫err + D/16 * derr
#   절대값이 커 보여도 실효 이득은 이 스케일로 나눈 값이다.
#
# ┌─ ★ 튜닝 순서 ★ ────────────────────────────────────────────────┐
# │ D 가 0 인 상태에서 P 만 올리면 감쇠가 없어 발진한다.           │
# │ 반드시 D 를 먼저 넣고 P 를 올릴 것.                            │
# │ 노드가 D/I/P 를 한 패킷(6바이트 SyncWrite)으로 쓰므로,         │
# │ 적용 순간에 P 만 먼저 들어가는 일은 없다.                      │
# └────────────────────────────────────────────────────────────────┘
#
# ── 측정 기준선 (P=800, D=0) ──
#   제자리 보행 2Hz 기준
#     관절 진폭 추종률  0.51 ~ 0.64     ← 목표 0.8 이상
#     imu_wz rms        0.954           ← 목표 감소
#   게인을 올리면 추종률과 함께 5.4Hz 기생 진동도 더 전달될 수 있으므로
#   두 지표를 반드시 같이 볼 것.
#     추종률↑ imu_wz↓ → 성공
#     추종률↑ imu_wz↑ → D 부족. D 를 더 올린다
#     추종률↓ imu_wz↑ → 발진. 되돌린다
#
# ── 발열 주의 ──
#   P 를 올리면 정지 상태에서도 전류가 늘어난다. XM540 은 152:1 감속기라
#   한 발 지지 구간의 무릎이 가장 먼저 뜨거워진다. 게인 상향 후 5 분쯤
#   돌려보고 온도가 눈에 띄게 오르면 그 단계에서 멈출 것.
#     ros2 run humanoid_serial_bridge motor_monitor_tui
# ============================================================================

# XM540 공장 기본값. 아래에서 덮어쓰지 않은 관절에 적용된다.
default:
  position_p_gain: 800
  position_i_gain: 0
  position_d_gain: 0

groups:
  # match: 관절 이름에 이 문자열이 들어가면 해당 그룹으로 판정한다.
  #        먼저 선언된 그룹이 이긴다.
  legs:
    match: [pelvis, knee, ankle]
    # ── 튜닝 단계 ──
    # 1단계: D 만 넣어 감쇠 확보 (P 는 800 유지)
    #          position_d_gain: 500
    # 2단계: P 와 D 함께 상향
    #          position_p_gain: 1200
    #          position_d_gain: 800
    # 3단계: 더 필요하면
    #          position_p_gain: 1600
    #          position_d_gain: 1200
    #
    # 현재: 1단계
    position_p_gain: 800
    position_d_gain: 500

  arms:
    match: [shoulder, elbow]
    # 팔은 정책에서 stiffness 0 으로 두고 접힌 상태만 유지하므로
    # 게인을 올려도 의미가 없다. 전류만 늘어난다. 기본값 유지.
    position_p_gain: 800
    position_d_gain: 500

    # ── Goal PWM(100) 상한 — 낙상 시 감속기 보호 ────────────────
    # 위치 제어 모드에서 PID 가 계산한 PWM 출력에 상한을 건다.
    # 일정 힘을 넘으면 관절이 항복하므로, 접지 충격이 152.3:1 감속기로
    # 그대로 전달되는 것과 모터가 버티다 Overload 래치가 나는 것을 막는다.
    #
    # ★ 단위: PWM Limit(36) = 885 가 100%. 1 LSB ≈ 0.113%
    #   "PWM 100" 은 100% 가 아니라 11.3% 다.
    #
    # ── 실측 (2026-08, ID 13 = l_shoulder_pitch, khuber_arm_pwm_test) ──
    #   자세 유지에 실제로 쓰인 PWM : 31        (전류 175 mA)
    #   유지 하한 (이 아래로는 처짐) : 30        ← 여유가 전혀 없음
    #   1.0 rad 이동에 필요한 최소값 : 150
    #   손으로 밀어 항복하는 상한    : 400
    #   → 운용 구간 60 ~ 400
    #
    # ── 왜 100 인가 ──
    #   낮을수록 보호가 좋으므로 구간의 '아래쪽'을 택한다.
    #   유지 실측(31)의 약 3.2배 여유 → 보행 중 몸통 가속으로 생기는
    #   동적 부하를 흡수할 만큼은 되고, 항복 상한(400)보다 4배 낮다.
    #   보행 중 팔이 처지거나 흔들리면 130 → 160 순으로 올릴 것.
    #   (구간 중앙값 230 은 보호 관점에서 너무 높다. 유지 수요의 7배다)
    #
    # ★ robot_init / standup 은 팔을 '이동'시켜야 하므로(하한 150) 이 값으로는
    #   목표에 도달하지 못한다. 그래서 두 behavior 는 진입 시 자동으로
    #   885 로 올리고 종료 시 이 값으로 되돌린다.
    #   (robot_init_behavior._raise_goal_pwm / standup_behavior 참조)
    #
    # 이 줄을 지우면 Goal PWM 을 건드리지 않는다 = 기존 동작 그대로.
    goal_pwm: 50

  neck:
    # 2026-08 이관: 목이 U2D2 버스로 넘어오면서 게인 관리 대상에 포함됐다.
    # match 를 안 적으면 default(P=800, D=0)로 들어간다 — 목 이름에는
    # pelvis/knee/ankle/shoulder/elbow 가 없어서 다른 그룹에 걸리지 않는다.
    match: [neck]
    # ── 왜 다리보다 낮게 잡는가 ──
    #   1) 부하가 카메라 무게뿐이라 다리만큼 강성이 필요 없다.
    #   2) P 가 높으면 보행 중 몸통 진동이 목에 그대로 전달돼 영상이 떨린다.
    #      목은 "정확히 그 각도" 보다 "흔들리지 않는 것" 이 훨씬 중요하다.
    #   3) MX-64 는 XM540 보다 감속비가 낮아(1/200 이 아님) 같은 게인에서
    #      더 민감하게 반응한다.
    # 영상이 떨리면 P 를 400 → 300 으로 내리고, 목표각을 못 따라가면
    # D 를 유지한 채 P 만 100 씩 올릴 것.
    position_p_gain: 400
    position_i_gain: 0
    position_d_gain: 200

# 개별 관절 오버라이드 (그룹보다 우선).
# 무릎만 더 세게 잡는 식의 세밀한 튜닝에 쓴다.
joints: {}
# 예시:
# joints:
#   r_knee_pitch_joint:
#     position_p_gain: 1600
#     position_d_gain: 1000
#   l_knee_pitch_joint:
#     position_p_gain: 1600
#     position_d_gain: 1000
