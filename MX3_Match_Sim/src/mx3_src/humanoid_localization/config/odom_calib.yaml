# =============================================================================
#  odom_calib.yaml  —  walk_odometry_node 파라미터
#  최상위 키('walk_odometry_node')는 노드 이름과 일치해야 한다.
# =============================================================================
walk_odometry_node:
  ros__parameters:
    # --- vx calibration lookup table (명령 vx -> 실제 vx) ---
    #   후진(음수)~전진(양수) 전 구간을 한 테이블에 담는다.
    #   calib_vx_cmd 는 반드시 오름차순(음수→양수).
    #
    #   [측정값]  전진 0.3 → 0.2353 (4/17), 0.4 → 0.2857 (4/14)
    #   [데드존]  전진 0.1 정지 / 후진 0.2 까지 정지  → 해당 칸 0.0
    #   [추정값]  아래 칸은 아직 미측정 → 임시 추정값. 측정 후 교체 권장:
    #              · 전진 0.2 실제속도(현재 0.05 로 가정)
    #              · 후진 0.3(현재 -0.02), 0.4(현재 -0.18) 실제속도
    calib_vx_cmd:  [-0.4,  -0.3,  -0.2, -0.1, 0.0, 0.1, 0.2,  0.3,    0.4]
    calib_vx_real: [-0.18, -0.02,  0.0,  0.0, 0.0, 0.0, 0.18, 0.25, 0.2857]


    # vy(횡이동) 보정 스케일.
    #   0.0 = vy 무시(오도메트리가 횡이동을 적분하지 않음).
    #   vy 가 실제로도 거의 안 움직이고 부정확하므로 0 으로 비활성화.
    #   나중에 vy 를 쓰고 싶으면 실측 비율(예: 0.5~0.7)로 올린다.
    vy_scale: 0.0

    publish_rate: 50.0
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true
    use_imu_yaw: true            # 회전은 IMU yaw 사용(권장) → wz 명령 calib 불필요
    kick_done_topic: "/kick_done"
    post_kick_imu_yaw_sec: 3.0   # /kick_done 후 cmd 없어도 yaw만 IMU로 반영
    # odom->base_link TF z 오프셋(m). base_link 을 직립 높이만큼 띄워
    # RViz 에서 발이 지면(z=0)에 놓이게 한다. /odom 토픽 z 는 0 유지.
    base_height: 0.37            # 직립 시 base_link → 발바닥 수직 거리(측정값으로 교체)
    
# =============================================================================
#  nav_cmd_bridge_node  파라미터
#  Nav2(m/s) → 정책 명령값 역변환 + 데드존 보정.
#  ★ 전진 측정점은 walk_odometry 의 calib 와 일관되게 유지할 것.
#     (calib_vx_real 의 양수 구간 ↔ calib_vx_cmd 의 양수 구간)
# =============================================================================
nav_cmd_bridge_node:
  ros__parameters:
    # 전진 역calib: 실제속도(m/s, 오름차순) ↔ 명령값
    fwd_real: [0.1857, 0.2353, 0.2857]
    fwd_cmd:  [0.2,    0.3,    0.4]
    min_real_fwd: 0.1857     # 이 미만 실제속도는 데드존
    min_cmd_fwd: 0.2         # 데드존인데 전진해야 하면 줄 최소 명령
    stop_eps: 0.03           # |vx| 이보다 작으면 정지(0)

    allow_reverse: true      # 후진 허용 — BackUp 동작용. 후진 요청 시 데드존 넘는 -min_cmd_bwd 로 자동 보정.
                             #   RPP 는 allow_reversing=false 라 후진 명령을 안 내므로 일반 주행엔 영향 없음.
    min_cmd_bwd: 0.3         # 후진 최소 작동 명령(관측상 0.3부터 움직임). 안 움직이면 ↑(0.35~0.4)

    wz_scale: 0.7            # 실제 wz ≈ 0.7 × 명령 (측정: 1.0→0.698)
    max_cmd_wz: 1.5
    wz_eps: 0.02

    # --- 회전 데드존 보상 (전진 여부로 하한을 다르게) ---
    #   제자리 회전(전진≈0)은 큰 명령이라야 actor 가 돌고,
    #   곡선 주행(전진 있음)은 작은 회전도 되지만 너무 작은 명령은 효과가 없다.
    min_cmd_wz_spin: 1.2     # 제자리 회전 최소 작동 명령
    spin_vx_eps: 0.05        # |vx명령| 이 미만이면 제자리 회전으로 간주
    min_cmd_wz_curve: 0.1    # 곡선 주행 시 회전 최소 명령(이 미만 요청은 0.1 로 올림)
