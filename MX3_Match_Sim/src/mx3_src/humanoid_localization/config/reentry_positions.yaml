# ==========================================================================
# reentry_positions.yaml  (humanoid_localization/config)
# --------------------------------------------------------------------------
# 재진입 시드 위치의 "로봇별 x 오프셋". relocalize_button_node 가 실행버튼으로
# /initialpose 를 쏠 때, 로봇마다 사이드라인 시작 x 를 조금씩 다르게 둔다.
#
# vision_localization.launch.py 가 hostname 앞부분으로 섹션을 고른다
#   (control.launch 와 동일 규약: robo04-desktop → robo04).
# 섹션이 없거나 파일이 없으면 0.0 으로 폴백.
#
# 규약: 우리 골 = -x (고정). x_inset_m = "골라인에서 미드필드(+x) 쪽으로 당기는 양(m)".
#   양수  → 시드가 우리 골라인에서 안쪽(미드필드)으로 이동(x 가 덜 음수)
#   0     → 우리 골라인 코너(기본)
#   음수  → 골라인보다 더 바깥(더 음수)으로
#
# ※ 이 값은 "시드 위치(로컬라이제이션)" 설정이라 localization 패키지가 소유한다.
#   하드웨어 quirk(IMU/킥 튜닝 등)는 humanoid_bringup/config/robot_params.yaml.
#   서로 성격이 다른 설정이므로 분리해 둔다.
# ==========================================================================

robo01:
  x_inset_m: 0.7
robo02:
  x_inset_m: 1.4
robo03:
  x_inset_m: 2.1
robo04:
  x_inset_m: 2.8
